spring.application.name=tracker

# Secrets come from environment variables or a gitignored backend/.env file (KEY=value lines, see .env.example).
# The path is relative to the working directory, which is backend/ when started with ./mvnw.
spring.config.import=optional:file:.env[.properties]

# --- Database (DB_PASSWORD is required; URL and user default to local dev) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/egov_tracker}
spring.datasource.username=${DB_USER:egov}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- JWT (admin auth) ---
# Required, at least 32 bytes. No default on purpose: a secret committed here would let anyone forge admin tokens.
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-minutes=480

# --- CORS: the Vite dev server ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Seed data: inserted on startup only when the project table is empty ---
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-email=admin@tracker.local
# Optional. If unset, a random password is generated and printed once in the startup log when the admin is created.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}

# RFC 9457 problem+json bodies for errors (400/404/401...), so the frontend gets a consistent error shape.
spring.mvc.problemdetails.enabled=true

# --- Citizen report submissions (public endpoint) ---
# Hard caps applied while the request is parsed, before any controller code runs.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-part-count=10
# Read past a moderately oversized upload so the client gets a clean 413 instead of a dropped connection.
server.tomcat.max-swallow-size=10MB
# Report photos are stored here (relative to backend/ when started with ./mvnw). Gitignored.
app.uploads.dir=${UPLOADS_DIR:uploads}
# Per client address: at most this many submissions per window.
app.reports.rate-limit.max=${REPORT_RATE_LIMIT_MAX:5}
app.reports.rate-limit.window-minutes=15
